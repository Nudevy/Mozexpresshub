<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin:0; background:#f8fafc; -webkit-tap-highlight-color: transparent; }
  * { -webkit-user-select:none; user-select:none; }
  input, select { user-select:text; -webkit-user-select:text; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const STORAGE_PRODUCTS = "mozexpress_products";
const STORAGE_SALES = "mozexpress_sales";

const fmt = (n) => new Intl.NumberFormat("pt-MZ", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n || 0);
const todayKey = (d = new Date()) => d.toISOString().slice(0, 10);

const seedProducts = [
  { id: "p1", name: "Smartwatch X1", price: 2500, cost: 1500, stock: 12 },
  { id: "p2", name: "AirPods Pro (réplica)", price: 1800, cost: 1000, stock: 20 },
  { id: "p3", name: "Caixa de Som Bluetooth", price: 1200, cost: 700, stock: 15 },
];

function useStorage() {
  const [products, setProducts] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_PRODUCTS);
      return raw ? JSON.parse(raw) : seedProducts;
    } catch (e) { return seedProducts; }
  });
  const [sales, setSales] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_SALES);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  });

  const saveProducts = (next) => {
    setProducts(next);
    try { localStorage.setItem(STORAGE_PRODUCTS, JSON.stringify(next)); } catch (e) {}
  };
  const saveSales = (next) => {
    setSales(next);
    try { localStorage.setItem(STORAGE_SALES, JSON.stringify(next)); } catch (e) {}
  };

  return { products, sales, saveProducts, saveSales };
}

// --- Simple inline icons (no external icon library needed) ---
const Icon = {
  Cart: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||20} height={p.size||20} fill="none" stroke={p.color||"currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
    </svg>
  ),
  Plus: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||20} height={p.size||20} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>
  ),
  Trash: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||20} height={p.size||20} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path>
    </svg>
  ),
  Trend: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||20} height={p.size||20} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
  ),
  Package: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||20} height={p.size||20} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><polyline points="3.29 7 12 12 20.71 7"></polyline><line x1="12" y1="22" x2="12" y2="12"></line></svg>
  ),
  Dollar: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||20} height={p.size||20} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
  ),
  Alert: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||20} height={p.size||20} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
  ),
  Receipt: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||20} height={p.size||20} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2h16v20l-3-2-2 2-2-2-2 2-2-2-2 2-3-2Z"></path><line x1="8" y1="7" x2="16" y2="7"></line><line x1="8" y1="11" x2="16" y2="11"></line></svg>
  ),
  Grid: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||20} height={p.size||20} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
  ),
  Layers: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||20} height={p.size||20} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
  ),
  Chevron: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||20} height={p.size||20} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
  ),
  X: (p) => (
    <svg viewBox="0 0 24 24" width={p.size||20} height={p.size||20} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
  ),
};

function Logo({ size = 44 }) {
  return (
    <div className="flex items-center gap-3">
      <div className="flex items-center justify-center rounded-full bg-white shrink-0" style={{ width: size, height: size }}>
        <Icon.Cart color="#1657C7" size={size * 0.5} />
      </div>
      <div className="leading-tight">
        <div className="font-extrabold text-white tracking-tight" style={{ fontSize: size * 0.42 }}>
          MozExpress<span className="font-normal text-blue-200"> Hub.online</span>
        </div>
        <div className="text-blue-200 tracking-[0.2em] font-medium" style={{ fontSize: size * 0.19 }}>SOLUÇÃO FÁCIL</div>
      </div>
    </div>
  );
}

function StatCard({ icon: I, label, value, tone = "blue", sub }) {
  const tones = {
    blue: "bg-blue-50 text-blue-700 ring-blue-100",
    green: "bg-emerald-50 text-emerald-700 ring-emerald-100",
    amber: "bg-amber-50 text-amber-700 ring-amber-100",
    red: "bg-red-50 text-red-700 ring-red-100",
  };
  return (
    <div className="bg-white rounded-2xl p-4 shadow-sm ring-1 ring-slate-100 flex items-start gap-3">
      <div className={`rounded-xl p-2.5 ring-1 ${tones[tone]}`}><I size={20} /></div>
      <div>
        <div className="text-xs font-medium text-slate-500">{label}</div>
        <div className="text-xl font-bold text-slate-900 mt-0.5">{value}</div>
        {sub && <div className="text-xs text-slate-400 mt-0.5">{sub}</div>}
      </div>
    </div>
  );
}

function Dashboard({ products, sales }) {
  const today = todayKey();
  const salesToday = sales.filter((s) => todayKey(new Date(s.date)) === today);
  const revenueToday = salesToday.reduce((a, s) => a + s.total, 0);
  const profitToday = salesToday.reduce((a, s) => a + s.profit, 0);
  const revenueTotal = sales.reduce((a, s) => a + s.total, 0);
  const profitTotal = sales.reduce((a, s) => a + s.profit, 0);
  const stockValue = products.reduce((a, p) => a + p.price * p.stock, 0);
  const lowStock = products.filter((p) => p.stock <= 3);

  const last7 = useMemo(() => {
    const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); return d; });
    const vals = days.map((d) => {
      const key = todayKey(d);
      return sales.filter((s) => todayKey(new Date(s.date)) === key).reduce((a, s) => a + s.total, 0);
    });
    const max = Math.max(1, ...vals);
    return days.map((d, i) => ({ dia: d.toLocaleDateString("pt-MZ", { weekday: "short" }), valor: vals[i], pct: (vals[i] / max) * 100 }));
  }, [sales]);

  return (
    <div className="space-y-5">
      <div className="grid grid-cols-2 gap-3">
        <StatCard icon={Icon.Dollar} label="Faturamento hoje" value={`${fmt(revenueToday)} MT`} tone="blue" />
        <StatCard icon={Icon.Trend} label="Lucro hoje" value={`${fmt(profitToday)} MT`} tone="green" />
        <StatCard icon={Icon.Receipt} label="Faturamento total" value={`${fmt(revenueTotal)} MT`} tone="blue" sub={`${sales.length} vendas`} />
        <StatCard icon={Icon.Trend} label="Lucro total" value={`${fmt(profitTotal)} MT`} tone="green" />
        <StatCard icon={Icon.Package} label="Valor em estoque" value={`${fmt(stockValue)} MT`} tone="amber" />
        <StatCard icon={Icon.Alert} label="Estoque baixo" value={lowStock.length} tone={lowStock.length ? "red" : "blue"} sub={lowStock.length ? lowStock.map((p) => p.name).join(", ") : "Tudo em ordem"} />
      </div>
      <div className="bg-white rounded-2xl p-4 shadow-sm ring-1 ring-slate-100">
        <div className="text-sm font-semibold text-slate-700 mb-3">Faturamento dos últimos 7 dias</div>
        <div className="flex items-end justify-between gap-2" style={{ height: 140 }}>
          {last7.map((d, i) => (
            <div key={i} className="flex-1 flex flex-col items-center gap-1.5">
              <div className="w-full bg-blue-100 rounded-t-md relative" style={{ height: 100 }}>
                <div className="absolute bottom-0 left-0 right-0 bg-blue-700 rounded-t-md transition-all" style={{ height: `${d.pct}%` }}></div>
              </div>
              <div className="text-[10px] text-slate-400 font-medium">{d.dia}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Estoque({ products, saveProducts }) {
  const [form, setForm] = useState({ name: "", price: "", cost: "", stock: "" });
  const [showForm, setShowForm] = useState(false);

  const addProduct = () => {
    if (!form.name || !form.price || !form.stock) return;
    const next = [...products, { id: "p" + Date.now(), name: form.name, price: parseFloat(form.price) || 0, cost: parseFloat(form.cost) || 0, stock: parseInt(form.stock) || 0 }];
    saveProducts(next); setForm({ name: "", price: "", cost: "", stock: "" }); setShowForm(false);
  };
  const removeProduct = (id) => saveProducts(products.filter((p) => p.id !== id));
  const adjustStock = (id, delta) => saveProducts(products.map((p) => (p.id === id ? { ...p, stock: Math.max(0, p.stock + delta) } : p)));

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <div className="text-sm font-semibold text-slate-700">Produtos ({products.length})</div>
        <button onClick={() => setShowForm((v) => !v)} className="flex items-center gap-1.5 bg-blue-700 text-white text-sm font-medium px-3 py-2 rounded-xl active:scale-95 transition">
          <Icon.Plus size={16} /> Produto
        </button>
      </div>
      {showForm && (
        <div className="bg-white rounded-2xl p-4 shadow-sm ring-1 ring-slate-100 space-y-3">
          <input placeholder="Nome do produto" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200" />
          <div className="grid grid-cols-3 gap-2">
            <input placeholder="Preço (MT)" type="number" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} className="border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200" />
            <input placeholder="Custo (MT)" type="number" value={form.cost} onChange={(e) => setForm({ ...form, cost: e.target.value })} className="border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200" />
            <input placeholder="Qtd." type="number" value={form.stock} onChange={(e) => setForm({ ...form, stock: e.target.value })} className="border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200" />
          </div>
          <button onClick={addProduct} className="w-full bg-blue-700 text-white text-sm font-semibold py-2.5 rounded-xl active:scale-95 transition">Guardar produto</button>
        </div>
      )}
      <div className="space-y-2">
        {products.map((p) => (
          <div key={p.id} className="bg-white rounded-2xl p-3.5 shadow-sm ring-1 ring-slate-100 flex items-center gap-3">
            <div className="flex-1 min-w-0">
              <div className="font-semibold text-slate-800 text-sm truncate">{p.name}</div>
              <div className="text-xs text-slate-400 mt-0.5">Preço {fmt(p.price)} MT · Custo {fmt(p.cost)} MT</div>
            </div>
            <div className="flex items-center gap-1.5">
              <button onClick={() => adjustStock(p.id, -1)} className="w-7 h-7 rounded-lg bg-slate-100 text-slate-600 text-sm font-bold flex items-center justify-center active:scale-90">−</button>
              <span className={`min-w-[2.25rem] text-center font-bold text-sm px-1.5 py-1 rounded-lg ${p.stock <= 3 ? "bg-red-50 text-red-600" : "bg-blue-50 text-blue-700"}`}>{p.stock}</span>
              <button onClick={() => adjustStock(p.id, 1)} className="w-7 h-7 rounded-lg bg-slate-100 text-slate-600 text-sm font-bold flex items-center justify-center active:scale-90">+</button>
            </div>
            <button onClick={() => removeProduct(p.id)} className="text-slate-300 active:text-red-500 p-1"><Icon.Trash size={16} /></button>
          </div>
        ))}
        {products.length === 0 && <div className="text-center text-slate-400 text-sm py-10">Nenhum produto no estoque ainda.</div>}
      </div>
    </div>
  );
}

function NovaVenda({ products, sales, saveProducts, saveSales, setMsg }) {
  const [mode, setMode] = useState("simples");
  const [items, setItems] = useState([{ productId: "", qty: 1 }]);
  const [comboPrice, setComboPrice] = useState("");
  const productOptions = products.filter((p) => p.stock > 0);

  const updateItem = (idx, field, value) => setItems((prev) => prev.map((it, i) => (i === idx ? { ...it, [field]: value } : it)));
  const addItemRow = () => { if (items.length < 3) setItems((prev) => [...prev, { productId: "", qty: 1 }]); };
  const removeItemRow = (idx) => setItems((prev) => prev.filter((_, i) => i !== idx));

  const resolvedItems = items.filter((it) => it.productId).map((it) => {
    const prod = products.find((p) => p.id === it.productId);
    return prod ? { ...it, product: prod, qty: Number(it.qty) || 1 } : null;
  }).filter(Boolean);

  const sumIndividual = resolvedItems.reduce((a, it) => a + it.product.price * it.qty, 0);
  const sumCost = resolvedItems.reduce((a, it) => a + it.product.cost * it.qty, 0);
  const finalTotal = mode === "promo" && comboPrice !== "" ? parseFloat(comboPrice) || 0 : sumIndividual;
  const profit = finalTotal - sumCost;
  const canSubmit = resolvedItems.length > 0 && (mode === "simples" || resolvedItems.length >= 2) && resolvedItems.every((it) => it.qty > 0 && it.qty <= it.product.stock);

  const registarVenda = () => {
    if (!canSubmit) return;
    const updatedProducts = products.map((p) => {
      const match = resolvedItems.find((it) => it.product.id === p.id);
      return match ? { ...p, stock: p.stock - match.qty } : p;
    });
    const sale = {
      id: "s" + Date.now(), date: new Date().toISOString(), type: mode,
      items: resolvedItems.map((it) => ({ productId: it.product.id, name: it.product.name, qty: it.qty, unitPrice: it.product.price })),
      total: finalTotal, cost: sumCost, profit,
    };
    saveProducts(updatedProducts); saveSales([sale, ...sales]);
    setItems([{ productId: "", qty: 1 }]); setComboPrice("");
    setMsg("Venda registada e estoque atualizado ✓"); setTimeout(() => setMsg(""), 2500);
  };

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-2xl p-1.5 shadow-sm ring-1 ring-slate-100 flex gap-1.5">
        <button onClick={() => { setMode("simples"); setItems([{ productId: "", qty: 1 }]); setComboPrice(""); }} className={`flex-1 text-sm font-semibold py-2 rounded-xl transition ${mode === "simples" ? "bg-blue-700 text-white" : "text-slate-500"}`}>Venda simples</button>
        <button onClick={() => { setMode("promo"); setItems([{ productId: "", qty: 1 }, { productId: "", qty: 1 }]); }} className={`flex-1 text-sm font-semibold py-2 rounded-xl transition ${mode === "promo" ? "bg-blue-700 text-white" : "text-slate-500"}`}>Promoção (2–3 produtos)</button>
      </div>
      <div className="bg-white rounded-2xl p-4 shadow-sm ring-1 ring-slate-100 space-y-3">
        {items.map((it, idx) => {
          const prod = products.find((p) => p.id === it.productId);
          return (
            <div key={idx} className="flex items-center gap-2">
              <select value={it.productId} onChange={(e) => updateItem(idx, "productId", e.target.value)} className="flex-1 border border-slate-200 rounded-xl px-2.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200">
                <option value="">Selecionar produto…</option>
                {productOptions.map((p) => <option key={p.id} value={p.id}>{p.name} · estoque {p.stock}</option>)}
              </select>
              <input type="number" min={1} max={prod ? prod.stock : 99} value={it.qty} onChange={(e) => updateItem(idx, "qty", e.target.value)} className="w-16 border border-slate-200 rounded-xl px-2 py-2 text-sm text-center focus:outline-none focus:ring-2 focus:ring-blue-200" />
              {items.length > 1 && <button onClick={() => removeItemRow(idx)} className="text-slate-300 active:text-red-500 p-1"><Icon.X size={16} /></button>}
            </div>
          );
        })}
        {mode === "promo" && items.length < 3 && <button onClick={addItemRow} className="text-blue-700 text-sm font-semibold flex items-center gap-1"><Icon.Plus size={14} /> Adicionar 3º produto</button>}
        {mode === "promo" && (
          <div>
            <label className="text-xs font-medium text-slate-500">Preço da promoção (MT)</label>
            <input type="number" placeholder={sumIndividual ? `Sugerido: ${fmt(sumIndividual)}` : "0.00"} value={comboPrice} onChange={(e) => setComboPrice(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm mt-1 focus:outline-none focus:ring-2 focus:ring-blue-200" />
          </div>
        )}
      </div>
      {resolvedItems.length > 0 && (
        <div className="bg-blue-50 rounded-2xl p-4 ring-1 ring-blue-100 space-y-1.5">
          <div className="flex justify-between text-sm"><span className="text-slate-500">Total da venda</span><span className="font-bold text-slate-800">{fmt(finalTotal)} MT</span></div>
          <div className="flex justify-between text-sm"><span className="text-slate-500">Custo</span><span className="font-medium text-slate-600">{fmt(sumCost)} MT</span></div>
          <div className="flex justify-between text-sm"><span className="text-slate-500">Lucro</span><span className={`font-bold ${profit >= 0 ? "text-emerald-600" : "text-red-600"}`}>{fmt(profit)} MT</span></div>
        </div>
      )}
      <button disabled={!canSubmit} onClick={registarVenda} className={`w-full py-3 rounded-xl font-bold text-sm transition active:scale-95 ${canSubmit ? "bg-blue-700 text-white" : "bg-slate-100 text-slate-400"}`}>Registar venda</button>
      {!canSubmit && resolvedItems.length > 0 && mode === "promo" && resolvedItems.length < 2 && <div className="text-xs text-amber-600 text-center">Uma promoção precisa de pelo menos 2 produtos.</div>}
    </div>
  );
}

function Vendas({ sales }) {
  const [open, setOpen] = useState(null);
  return (
    <div className="space-y-2">
      {sales.length === 0 && <div className="text-center text-slate-400 text-sm py-10">Ainda não há vendas registadas.</div>}
      {sales.map((s) => (
        <div key={s.id} className="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100 overflow-hidden">
          <button onClick={() => setOpen(open === s.id ? null : s.id)} className="w-full flex items-center gap-3 p-3.5">
            <div className={`rounded-xl p-2 ${s.type === "promo" ? "bg-amber-50 text-amber-600" : "bg-blue-50 text-blue-700"}`}>
              {s.type === "promo" ? <Icon.Layers size={16} /> : <Icon.Cart size={16} />}
            </div>
            <div className="flex-1 text-left min-w-0">
              <div className="text-sm font-semibold text-slate-800 truncate">{s.items.map((i) => i.name).join(" + ")}</div>
              <div className="text-xs text-slate-400">{new Date(s.date).toLocaleString("pt-MZ", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })}</div>
            </div>
            <div className="text-right">
              <div className="text-sm font-bold text-slate-800">{fmt(s.total)} MT</div>
              <div className="text-xs text-emerald-600 font-medium">+{fmt(s.profit)} MT</div>
            </div>
            <Icon.Chevron size={16} p={{}} />
          </button>
          {open === s.id && (
            <div className="border-t border-slate-100 px-3.5 py-3 space-y-1.5 bg-slate-50">
              {s.items.map((i, idx) => (
                <div key={idx} className="flex justify-between text-xs text-slate-500"><span>{i.qty}× {i.name}</span><span>{fmt(i.unitPrice * i.qty)} MT (preço normal)</span></div>
              ))}
              <div className="flex justify-between text-xs text-slate-500 pt-1"><span>Custo total</span><span>{fmt(s.cost)} MT</span></div>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function App() {
  const { products, sales, saveProducts, saveSales } = useStorage();
  const [tab, setTab] = useState("painel");
  const [msg, setMsg] = useState("");

  const tabs = [
    { id: "painel", label: "Painel", icon: Icon.Grid },
    { id: "estoque", label: "Estoque", icon: Icon.Package },
    { id: "venda", label: "Nova venda", icon: Icon.Cart },
    { id: "vendas", label: "Vendas", icon: Icon.Receipt },
  ];

  return (
    <div className="min-h-screen bg-slate-50 pb-24">
      <div className="bg-gradient-to-br from-blue-800 to-blue-600 px-4 pt-6 pb-8 rounded-b-3xl shadow-md">
        <Logo size={44} />
      </div>
      <div className="px-4 -mt-4">
        {msg && <div className="mb-3 text-sm font-medium px-3.5 py-2.5 rounded-xl shadow-sm bg-emerald-50 text-emerald-700 ring-1 ring-emerald-100">{msg}</div>}
        {tab === "painel" && <Dashboard products={products} sales={sales} />}
        {tab === "estoque" && <Estoque products={products} saveProducts={saveProducts} />}
        {tab === "venda" && <NovaVenda products={products} sales={sales} saveProducts={saveProducts} saveSales={saveSales} setMsg={setMsg} />}
        {tab === "vendas" && <Vendas sales={sales} />}
      </div>
      <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex px-2 py-2 shadow-[0_-2px_10px_rgba(0,0,0,0.04)]">
        {tabs.map((t) => (
          <button key={t.id} onClick={() => setTab(t.id)} className={`flex-1 flex flex-col items-center gap-1 py-1.5 rounded-xl transition ${tab === t.id ? "text-blue-700" : "text-slate-400"}`}>
            <t.icon size={20} />
            <span className="text-[10px] font-semibold">{t.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
